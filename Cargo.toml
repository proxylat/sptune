[package]
name = "sptune"
description = "A terminal user interface for Spotify"
keywords = ["spotify", "tui", "cli", "terminal"]
categories = ["command-line-utilities"]
version = "2.0.0"
authors = ["Proxy Works"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
lto = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
anyhow = "1.0.43"
rspotify = { version = "0.16.1", default-features = true }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde_yml = "0.0.13"
dirs = "6.0.0"
clap = "4.6.5"
unicode-width = "0.2.2"
arboard = "3.6.1"
crossterm = "0.29.0"
tokio = { version = "1.53.1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
chrono = "0.4"
futures = "0.3"
clap_complete = "4.6.5"
tokio-tungstenite = "0.30.0"
[target.'cfg(windows)'.dependencies]
win-gsmtc = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# tokio-only: no async-io background threads; runs on our watcher runtime.
zbus = { version = "5", default-features = false, features = ["tokio"] }


[patch.crates-io]
rspotify-model = { path = "vendor/rspotify-model" }

[dev-dependencies]
criterion = "0.8.2"
iai-callgrind = "0.16.1"

[[bench]]
name = "cache"
harness = false

[[bench]]
name = "config"
harness = false

[[bench]]
name = "iai"
harness = false

[[bench]]
name = "render"
harness = false

[[bench]]
name = "tick"
harness = false

[[bin]]
bench = false
path = "src/main.rs"
name = "sptune"

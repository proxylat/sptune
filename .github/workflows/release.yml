name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            bin: sptune
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            bin: sptune.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux audio/dbus dev libs
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpulse-dev libdbus-1-dev
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.bin }} dist/
          cp README.md LICENSE dist/
          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            tar -czf sptune-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C dist .
          else
            7z a sptune-${{ github.ref_name }}-${{ matrix.target }}.zip ./dist/*
          fi
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sptune-${{ github.ref_name }}-${{ matrix.target }}.*
          generate_release_notes: true
